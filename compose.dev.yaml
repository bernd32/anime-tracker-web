services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
      args:
        PYTHON_VERSION: "3.14"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SHIKIMORI_GRAPHQL_URL: ${SHIKIMORI_GRAPHQL_URL}
      SHIKIMORI_REQUEST_TIMEOUT_SECONDS: ${SHIKIMORI_REQUEST_TIMEOUT_SECONDS:-10}
      SHIKIMORI_CACHE_TTL_SECONDS: ${SHIKIMORI_CACHE_TTL_SECONDS:-31536000}
      SHIKIMORI_USER_AGENT: ${SHIKIMORI_USER_AGENT:-anime-backlog-web/1.0}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:20773","http://127.0.0.1:20773","http://192.168.88.40:20773"]}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "43968", "--reload"]
    volumes:
      - ./backend:/app
      - backend_venv:/opt/venv
    ports:
      - "${API_PORT:-43968}:43968"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_VERSION: "22"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:43968/api/v1}
      HOSTNAME: 0.0.0.0
      PORT: 20773
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "20773"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-20773}:20773"

volumes:
  backend_venv:
  frontend_node_modules:
  frontend_next:
