name: ${COMPOSE_PROJECT_NAME:-anime-backlog}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: "3.14"
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SHIKIMORI_GRAPHQL_URL: ${SHIKIMORI_GRAPHQL_URL}
      SHIKIMORI_REQUEST_TIMEOUT_SECONDS: ${SHIKIMORI_REQUEST_TIMEOUT_SECONDS:-10}
      SHIKIMORI_CACHE_TTL_SECONDS: ${SHIKIMORI_CACHE_TTL_SECONDS:-31536000}
      SHIKIMORI_USER_AGENT: ${SHIKIMORI_USER_AGENT:-anime-backlog-web/1.0}
      SHIKIMORI_HTTPS_PROXY_URL: ${SHIKIMORI_HTTPS_PROXY_URL:-}
      SHIKIMORI_SOCKS5_PROXY_URL: ${SHIKIMORI_SOCKS5_PROXY_URL:-}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:20773","http://127.0.0.1:20773","http://192.168.88.40:20773"]}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${API_PORT:-43968}:43968"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:43968/api/v1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NODE_VERSION: "22"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 20773
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${FRONTEND_PORT:-20773}:20773"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20773 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
